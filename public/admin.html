<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — North Bharat Jobs</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#182230}header{background:#10233f;color:white;padding:18px 22px;display:flex;justify-content:space-between}main{max-width:1200px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;border:1px solid #dde3ec;border-radius:14px;padding:16px}.big{font-size:28px;font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{border:1px solid #ccd5e2;background:white;border-radius:10px;padding:10px 14px;cursor:pointer}.panel{background:white;border:1px solid #dde3ec;border-radius:14px;padding:16px;overflow:auto}.row{padding:12px 0;border-bottom:1px solid #edf0f5}.row strong{display:block;margin-bottom:5px}.primary{background:#155eef;color:#fff;border:0;padding:9px 12px;border-radius:8px}.warn{background:#fff4d6;border:1px solid #e7c66a;padding:8px;border-radius:8px}input{padding:9px;border:1px solid #ccd5e2;border-radius:8px;margin:5px}.muted{color:#647188}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><header><strong>North Bharat Jobs — Admin Portal</strong><button onclick="logout()">Logout</button></header><main><div class="grid" id="stats"></div><div class="tabs"><button onclick="load('verification')">Verification Required</button><button onclick="load('published')">Published Jobs</button><button onclick="load('sources')">Sources</button><button onclick="load('runs')">Monitor Runs</button><button onclick="load('logs')">Verification Logs</button><button onclick="load('notifications')">Notifications</button><button onclick="load('audit')">Audit Logs</button><button onclick="load('security')">Security</button></div><div class="panel" id="panel">Loading…</div></main><script>
async function api(u,o){const r=await fetch(u,o);if(r.status===401){location='/admin/';return null}return r.json()}
async function boot(){const d=await api('/api/admin/dashboard');document.getElementById('stats').innerHTML=Object.entries(d.stats).map(([k,v])=>'<div class="card"><div>'+k.replaceAll('_',' ')+'</div><div class="big">'+v+'</div></div>').join('');load('verification')}
async function load(kind){if(kind==='security'){panel.innerHTML='<h2>Security</h2><p class="muted">The password is never stored in GitHub. The initial password comes from the Worker secret and can then be changed here.</p><form onsubmit="changePass(event)"><input id="cp" type="password" placeholder="Current password" required><input id="np" type="password" placeholder="New password (10+ chars)" required><button class="primary">Change password</button></form><hr><form onsubmit="changeEmail(event)"><input id="em" type="email" placeholder="New email" required><button class="primary">Change email</button></form>';return}
let url=kind==='verification'||kind==='published'?'/api/admin/items':kind==='sources'?'/api/admin/sources':kind==='runs'?'/api/admin/runs':kind==='logs'?'/api/admin/verification-logs':kind==='notifications'?'/api/admin/notifications':'/api/admin/audit';let d=await api(url);if(!d)return;let arr=d.items||d.sources||d.runs||d.logs||d.notifications||[];if(kind==='verification')arr=arr.filter(x=>x.status==='verification_required');if(kind==='published')arr=arr.filter(x=>x.status==='published');panel.innerHTML='<h2>'+kind.replaceAll('_',' ')+'</h2>'+arr.map(x=>'<div class="row"><strong>'+String(x.title||x.name||x.event_type||x.kind||('Run '+x.id))+'</strong><div>'+JSON.stringify(x).slice(0,900)+'</div>'+(kind==='verification'?'<button class="primary" onclick="verify('+x.id+')">Verify & Publish</button> <button class="warn" onclick="reject('+x.id+')">Reject</button>':'')+'</div>').join('')||'<p>No records.</p>'}
async function verify(id){await api('/api/admin/item/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});load('verification')}
async function reject(id){await api('/api/admin/item/reject',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});load('verification')}
async function changePass(e){e.preventDefault();const r=await api('/api/admin/password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({current:cp.value,next:np.value})});alert(r&&r.ok?'Password changed':(r&&r.error)||'Error')}
async function changeEmail(e){e.preventDefault();const r=await api('/api/admin/email',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:em.value})});alert(r&&r.ok?'Email changed':(r&&r.error)||'Error')}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});location='/admin/'}boot();
</script></body></html>
